name: Discord Notify - Push

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Embed
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "color": 5763719,
                "title": "New Push to `${{ github.ref_name }}`",
                "url": "${{ github.event.head_commit.url }}",
                "description": "```${{ github.event.head_commit.message }}```",
                "fields": [
                  {"name": "By", "value": "${{ github.actor }}", "inline": true},
                  {"name": "Commit", "value": "[`${{ github.sha }}`](${{ github.event.head_commit.url }})", "inline": true}
                ],
                "timestamp": "${{ github.event.head_commit.timestamp }}",
                "footer": {"text": "${{ github.repository }} • ${{ github.event.head_commit.author.username }}"}
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK }}
